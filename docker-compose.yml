version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tukki-postgres
    environment:
      POSTGRES_USER: tukki
      POSTGRES_PASSWORD: tukki123
      POSTGRES_DB: tukki_event
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tukki-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tukki"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tukki-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tukki-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS API
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: tukki-api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://tukki:tukki123@postgres:5432/tukki_event
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-this-in-production
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      PORT: 3000
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - /app/node_modules
      - /app/dist
    networks:
      - tukki-network
    command: npm run dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  tukki-network:
    driver: bridge
